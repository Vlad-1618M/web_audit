name: CI

on:
  pull_request:
    paths:
      - "v2_python_core/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  push:
    branches:
      - v.tools_main
      - main
      - "t*_*"
    paths:
      - "v2_python_core/**"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: v2_python_core

jobs:
  unit-tests:
    name: Unit tests (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2_python_core/pyproject.toml

      - name: Install webaudit + dev deps
        run: pip install -e ".[dev]"

      - name: Pytest (unit)
        run: |
          python -m pytest tests/unit \
            -v -s -x \
            --tb=short \
            -ra \
            --cov=webaudit \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: v2_python_core/coverage.xml
          if-no-files-found: error

  integration-wp:
    name: Integration (WordPress Docker fixture)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2_python_core/pyproject.toml

      - name: Install webaudit + dev deps
        run: pip install -e ".[dev]"

      - name: Start WordPress fixture (profile mid)
        env:
          WEBAUDIT_WP_PROFILE: mid
          WP_PORT: "8080"
        run: |
          docker compose -f docker/docker-compose.yml up -d wp-db wordpress
          docker compose -f docker/docker-compose.yml run --rm wp-init

      - name: Wait for WordPress on localhost
        run: |
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:8080/" >/dev/null && exit 0
            sleep 3
          done
          echo "WordPress not reachable on :8080"
          docker compose -f docker/docker-compose.yml logs wordpress
          exit 1

      - name: Pytest (integration)
        env:
          WEBAUDIT_WP_TEST_URL: http://127.0.0.1:8080
          WEBAUDIT_WP_PROFILE: mid
        run: python -m pytest tests/integration -v -s -ra --tb=short -m integration

      - name: Tear down Docker stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v --remove-orphans

  docker-image:
    name: Build webaudit Pro image
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: v2_python_core
        run: docker build -f docker/webaudit/Dockerfile -t webaudit:ci .

      - name: Smoke test CLI
        run: docker run --rm webaudit:ci --help

      - name: Verify Playwright + browsers in image
        run: |
          docker run --rm --entrypoint python webaudit:ci -c "import playwright"
          docker run --rm --init --entrypoint python webaudit:ci -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          print('playwright ok')
          "

  publish-ghcr:
    name: Publish webaudit image to GHCR
    runs-on: ubuntu-latest
    needs: unit-tests
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/v.tools_main' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract package version
        id: meta
        working-directory: v2_python_core
        run: |
          version="$(grep '^__version__ =' webaudit/__version__.py | sed -n '1s/.*"\(.*\)".*/\1/p')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${version}"

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.ghcr.outputs.owner }}/webaudit
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/v.tools_main' || github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: v2_python_core
          file: v2_python_core/docker/webaudit/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Published image summary
        run: |
          {
            echo "### webaudit Pro image published to GHCR"
            echo ""
            echo "Multi-arch manifest: \`linux/amd64\`, \`linux/arm64\` (Intel/ARM Mac + Linux)."
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${{ steps.ghcr.outputs.owner }}/webaudit:${{ steps.meta.outputs.version }}"
            echo "docker run --rm ghcr.io/${{ steps.ghcr.outputs.owner }}/webaudit:${{ steps.meta.outputs.version }} scan https://example.com --open none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
