name: macOS app CI

on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-ci.yml"
      - ".github/workflows/release-macos.yml"
  push:
    branches:
      - v.tools_main
      - main
      - dmg_installer
      - "macOS_*"
    paths:
      - "macos/**"
      - ".github/workflows/macos-ci.yml"


jobs:
  dmg-smoke:
    name: Build DMG + install smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Dev external-engine DMG smoke
        working-directory: macos
        run: |
          chmod +x orchestrate-macos.sh packaging/**/*.sh
          ./orchestrate-macos.sh dev-smoke

      - name: Public bundled-engine DMG smoke
        working-directory: macos
        run: |
          ./orchestrate-macos.sh public-smoke

      - name: Swift unit tests
        working-directory: macos/WebAuditMac
        run: swift test
