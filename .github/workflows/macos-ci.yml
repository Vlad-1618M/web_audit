name: macOS app CI

on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-ci.yml"
      - ".github/workflows/release-macos.yml"
  push:
    branches:
      - v.tools_main
      - main
      - dmg_installer
      - "macOS_*"
    paths:
      - "macos/**"
      - ".github/workflows/macos-ci.yml"

jobs:
  dmg-smoke:
    name: Build DMG + install smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke-test installer
        working-directory: macos/WebAuditMac
        run: |
          chmod +x scripts/*.sh
          ./scripts/smoke-install.sh

      - name: Swift unit tests
        working-directory: macos/WebAuditMac
        run: swift test
