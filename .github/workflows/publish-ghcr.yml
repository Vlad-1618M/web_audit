# Manual publish of webaudit Pro image to GHCR (optional — CI also publishes on push to main).
name: Publish GHCR image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra tag (e.g. 2.1.0b2); version tag always pushed from __version__.py"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract package version
        id: meta
        working-directory: v2_python_core
        run: |
          version="$(grep '__version__' webaudit/__version__.py | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag list
        id: tags
        run: |
          owner="${{ github.repository_owner }}"
          version="${{ steps.meta.outputs.version }}"
          extra="${{ github.event.inputs.tag }}"
          list="ghcr.io/${owner}/webaudit:${version},ghcr.io/${owner}/webaudit:latest,ghcr.io/${owner}/webaudit:sha-${GITHUB_SHA::7}"
          if [[ -n "$extra" && "$extra" != "$version" ]]; then
            list="${list},ghcr.io/${owner}/webaudit:${extra}"
          fi
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: v2_python_core
          file: v2_python_core/docker/webaudit/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: Summary
        run: |
          {
            echo "### Published to GHCR"
            echo ""
            echo "- \`ghcr.io/${{ github.repository_owner }}/webaudit:${{ steps.meta.outputs.version }}\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/webaudit:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
