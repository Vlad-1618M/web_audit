<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

  <!-- full-bleed square background; macOS squircle mask applied at icon build -->
  <rect width="1024" height="1024" fill="#0d1117"/>
  <rect x="5.5" y="5.5" width="1013" height="1013" rx="215" fill="none" stroke="#00b4d8" stroke-width="11"/>

  <!-- lens circle -->
  <circle cx="366" cy="366" r="212" fill="#0f1923" stroke="#00b4d8" stroke-width="15"/>
  <!-- amber arc -->
  <path d="M366 154 A212 212 0 0 1 578 366" fill="none" stroke="#f5a623" stroke-width="22" stroke-linecap="round"/>
  <!-- green filled inner circle -->
  <circle cx="366" cy="366" r="117" fill="#166534"/>
  <!-- checkmark -->
  <path d="M296 366 L340 412 L458 296" fill="none" stroke="#dcfce7" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- handle -->
  <line x1="504" y1="504" x2="600" y2="600" stroke="#00b4d8" stroke-width="40" stroke-linecap="round"/>

  <!-- WEB label -->
  <text x="132" y="762" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="18">WEB</text>
  <!-- AUDIT -->
  <text x="132" y="848" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="700" fill="#faf8f2" text-anchor="start" letter-spacing="8">AUDIT</text>
  <!-- PRO tag -->
  <rect x="594" y="800" width="176" height="72" rx="18" fill="#f5a623" opacity="0.15"/>
  <text x="682" y="849" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="600" fill="#f5a623" text-anchor="middle" letter-spacing="8">PRO</text>

  <!-- amber hygiene score ring -->
  <circle cx="862" cy="242" r="110" fill="#111827" stroke="#1e3a5f" stroke-width="8"/>
  <path d="M862 132 A110 110 0 1 1 752 242" fill="none" stroke="#f5a623" stroke-width="18" stroke-linecap="round"/>
  <text x="862" y="260" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="600" fill="#f5a623" text-anchor="middle">89</text>

  <!-- green exposure score ring -->
  <circle cx="862" cy="506" r="110" fill="#111827" stroke="#1e3a5f" stroke-width="8"/>
  <circle cx="862" cy="506" r="88" fill="none" stroke="#4ade80" stroke-width="18"/>
  <text x="862" y="524" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="600" fill="#4ade80" text-anchor="middle">100</text>

  <!-- hexagon with lock -->
  <polygon points="862,752 921,786 921,852 862,886 803,852 803,786" fill="none" stroke="#4ade80" stroke-width="9"/>
  <!-- lock body -->
  <rect x="840" y="822" width="44" height="34" rx="8" fill="#4ade80"/>
  <!-- lock shackle -->
  <path d="M848 822 L848 804 Q862 790 876 804 L876 822" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>
  <!-- keyhole -->
  <circle cx="862" cy="833" r="7" fill="#0d1117"/>

</svg>
