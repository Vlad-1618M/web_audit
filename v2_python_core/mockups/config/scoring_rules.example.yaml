# Optional scoring overrides — tune without code changes
# Loaded when config.scoring.rules_file is set (Tier 1 stub, Tier 2 full)

version: "1"

# Finding pattern → severity / class / scored
# Patterns match category + item + status

rules:
  - match:
      category: DNS
      item: DMARC
      status: MISSING
    severity: MEDIUM
    class: ACTION
    scored: true
    detail_template: "No DMARC record — email spoofing risk for {domain}"

  - match:
      category: DNS
      item: SPF
      status: MISSING
    severity: LOW
    class: ACTION
    scored: true

  - match:
      category: DNS
      item: DNSSEC
      status: UNSIGNED
    severity: INFO
    class: INFO
    scored: false

  - match:
      category: TLS
      item: TLS 1.0
      status: ACCEPTED
    severity: HIGH
    class: ACTION
    scored: true

  - match:
      category: TLS
      item: TLS 1.1
      status: ACCEPTED
    severity: MEDIUM
    class: ACTION
    scored: true

  - match:
      category: HEADERS
      item: Strict-Transport-Security
      status: MISSING
    severity: HIGH
    class: VERIFY
    scored: false
    when:
      cdn_detected: true
    detail_template: "HSTS not visible externally — may be set at {cdn} edge"

  - match:
      category: PLUGIN
      item: "*"
      status: STALE
    severity: MEDIUM
    class: ACTION
    scored: true
    detail_template: "{slug} v{version} behind wordpress.org latest {latest}"

  - match:
      category: PLUGIN
      item: "*"
      status: PREMIUM_DETECTED
    severity: INFO
    class: VERIFY
    scored: false
    detail_template: "{slug} — verify update channel (premium or custom)"

  - match:
      category: PLUGIN_CVE
      item: "*"
      status: MATCH
    severity: HIGH
    class: ACTION
    scored: true
    when:
      cve_auth: none

  - match:
      category: PLUGIN_CVE
      item: "*"
      status: MATCH
    severity: MEDIUM
    class: VERIFY
    scored: false
    when:
      cve_auth: contributor

  - match:
      category: SEO_SURFACE
      item: "*"
      status: "*"
    severity: INFO
    class: INFO
    scored: false

hygiene_caps:
  PLUGIN: 30
  PLUGIN_CVE: 30

verdict_labels:
  PASS: "Looks reasonably hardened for a public business site"
  NEEDS_ATTENTION: "No obvious secret leaks, but fix configuration gaps"
  AT_RISK: "Serious issues — involve your developer immediately"
