# Web Audit v2 — Per-site profile example
# Modeled after how I configure muzar.io in v1 site_configs/
# Usage: webaudit scan https://acme-widgets.com --site-config site.example.yaml

host: acme-widgets.com
framework: auto   # auto-loads profiles/wordpress/ when detected

paths:
  extra_get:
    - /about/
    - /services/
    - /contact/
    - /blog/
    - /.well-known/security.txt

  expected_open:
    /about/: app_surface
    /services/: app_surface
    /contact/: app_surface
    /blog/: app_surface
    /robots.txt: public_seo
    /sitemap.xml: public_seo

rate_limit:
  post_targets:
    - path: /contact/submit
      probe_type: form
    - path: /api/v1/leads
      probe_type: json

misc:
  max_pages_sample: 10
  max_probe_urls_display: 100
  max_internal_urls_display: 150

# Merged after framework profile — see mockups/config/profiles/wordpress/
extensions:
  inherit_profile: true
  probe:
    mode: observed_only
  extra_watch:
    - advanced-custom-fields-pro
  ignore:
    - hello-dolly
  expected:
    - slug: wordfence
      note: "Client pays for premium — verify license separately"

collectors:
  dns:
    enabled: true
  extensions:
    enabled: true
  js:
    enabled: false

report:
  variant: executive
  theme: dark

output:
  open_browser: true
  formats:
    - html
    - json
    - pdf

notes: |
  Site owner: Jane at Acme Widgets — non-technical.
  WordPress agency build — I use executive variant + plugin section for dev handoff.
