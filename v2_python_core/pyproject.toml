[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webaudit"
version = "2.1.0b2"
description = "Web Audit v2 — external security hygiene for public websites"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vlad" }]
dependencies = [
  "httpx>=0.27",
  "dnspython>=2.6",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "tldextract>=5.0",
  "cryptography>=42.0",
  "beautifulsoup4>=4.12",
  "jinja2>=3.1",
  "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
  "pytest-cov>=5.0",
]
pdf = [
  "weasyprint>=62.0",
]
js = [
  "playwright>=1.42",
]

[project.scripts]
webaudit = "webaudit.cli.main:cli_entry"

[tool.hatch.build.targets.wheel]
packages = ["webaudit"]

[tool.hatch.build.targets.wheel.force-include]
"webaudit/config/defaults.yaml" = "webaudit/config/defaults.yaml"
"webaudit/profiles/wordpress/extensions.yaml" = "webaudit/profiles/wordpress/extensions.yaml"
"webaudit/profiles/django/extensions.yaml" = "webaudit/profiles/django/extensions.yaml"
"webaudit/profiles/laravel/extensions.yaml" = "webaudit/profiles/laravel/extensions.yaml"
"webaudit/profiles/rails/extensions.yaml" = "webaudit/profiles/rails/extensions.yaml"
"webaudit/profiles/generic/extensions.yaml" = "webaudit/profiles/generic/extensions.yaml"
"webaudit/templates/reports/technical/report.html" = "webaudit/templates/reports/technical/report.html"
"webaudit/templates/reports/technical/report.css" = "webaudit/templates/reports/technical/report.css"
"webaudit/templates/reports/executive/report.html" = "webaudit/templates/reports/executive/report.html"
"webaudit/templates/reports/executive/report.css" = "webaudit/templates/reports/executive/report.css"
"webaudit/templates/reports/minimal/report.html" = "webaudit/templates/reports/minimal/report.html"
"webaudit/templates/reports/minimal/report.css" = "webaudit/templates/reports/minimal/report.css"
"webaudit/templates/reports/dashboard/report.html" = "webaudit/templates/reports/dashboard/report.html"
"webaudit/templates/reports/dashboard/report.css" = "webaudit/templates/reports/dashboard/report.css"
"webaudit/templates/reports/digest/report.html" = "webaudit/templates/reports/digest/report.html"
"webaudit/templates/reports/digest/report.css" = "webaudit/templates/reports/digest/report.css"
"webaudit/templates/reports/_shared/head_print_dark.html" = "webaudit/templates/reports/_shared/head_print_dark.html"
"webaudit/templates/reports/_shared/discovery_section.html" = "webaudit/templates/reports/_shared/discovery_section.html"
"webaudit/templates/reports/_shared/discoverability_section.html" = "webaudit/templates/reports/_shared/discoverability_section.html"
"webaudit/templates/reports/_shared/cert_summary_section.html" = "webaudit/templates/reports/_shared/cert_summary_section.html"
"webaudit/templates/reports/_shared/js_render_section.html" = "webaudit/templates/reports/_shared/js_render_section.html"
"webaudit/templates/reports/_shared/owner_action_bar.html" = "webaudit/templates/reports/_shared/owner_action_bar.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "optional_pdf: integration test requiring weasyprint (pip install 'webaudit[pdf]')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
