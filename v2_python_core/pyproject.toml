[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webaudit"
version = "2.0.0a1"
description = "Web Audit v2 — external security hygiene for public websites"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vlad" }]
dependencies = [
  "httpx>=0.27",
  "dnspython>=2.6",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "tldextract>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
  "pytest-cov>=5.0",
]

[project.scripts]
webaudit = "webaudit.cli.main:cli_entry"

[tool.hatch.build.targets.wheel]
packages = ["webaudit"]

[tool.hatch.build.targets.wheel.force-include]
"webaudit/config/defaults.yaml" = "webaudit/config/defaults.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
