framework: wordpress
fingerprint_unit: plugin
min_detection_confidence: 0.65

probe:
  mode: observed_only
  readme_fetch: observed_only
  sources:
    - html_assets
    - readme_txt

compare:
  wporg_api: true

vuln:
  enabled: true
  source: cache
  cache_ttl_days: 14
  auth_required_default_class: VERIFY
  exposure_on_unauth_cve_only: true

scoring:
  hygiene_cap: 30

