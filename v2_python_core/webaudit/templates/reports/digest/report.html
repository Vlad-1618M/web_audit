<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Audit — {{ host_label }} (Digest)</title>
  {% include "head_print_dark.html" %}
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <div class="digest-wrap">
    <div class="toolbar no-print">
      <button type="button" class="btn-edge-cyan" onclick="window.print()">Print / Save as PDF</button>

    </div>

    {% include "digest_body.html" %}

    <footer>
      Web Audit v{{ webaudit_version }} · Owner digest · Framework {{ framework }}
    </footer>
  </div>
</body>
</html>
